<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
</head>

<body style="background-color: rgb(181, 121, 163); color: black;">
    <ul class="language">
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
    </ul>
</body>
<script>
    function addLangauge(langname) {
        const li = document.createElement('li')
        li.innerHTML = `${langname}`
        document.querySelector('.language').
            appendChild(li)
    }
    addLangauge("C++")
    addLangauge("RUBY")

    // ADD BUT IN OPTIMIATION WAY DSA USED ,in above we doing tree traversal and in below we are doing only one time traversal

    function optiLanguage(langname) {
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langname))
        document.querySelector('.language').
            appendChild(li)
    }

    optiLanguage("C#")
    optiLanguage("PHP")

    //EDITING THE ELEMENTS 3,ways

    const secondlang = document.querySelector("li:nth-child(2)")
    //secondlang.innerHTML = "GoLang"
    const newli = document.createElement("li")
    newli.textContent = "mojo"
    secondlang.replaceWith(newli)

    //edit
    const firstlang = document.querySelector("li:first-child")
    firstlang.outerHTML = "<li>TypeScript</li>"

    //remove
    const thirdlang = document.querySelector("li:nth-child(3)")
    thirdlang.remove()//Java deleted

</script>

</html>
